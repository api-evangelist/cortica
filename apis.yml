aid: cortica
name: Cortica
description: 'Cortica is a Tel Aviv, Israel based Autonomous AI company founded in
  2007 that builds and spins out category-leading AI companies. Its self-learning,
  unsupervised "Autonomous AI" is modelled on the mammalian cortex — signatures instead
  of labels, adaptive architecture, and self-learning neural networks that index high
  volumes of visual, audio, radar and time-series signal on low-compute platforms.
  Cortica states it has invested more than $250M over 15 years and holds 300+ patents,
  and it operates as a venture builder rather than a product vendor: its technology
  reaches the market through partner joint ventures and spin-outs including Autobrains
  (autonomous driving), Corsight AI (facial recognition), Corsound AI (voice), SeeTrue
  (airport security screening), CordiGuide (medical imaging) and Lean AI / Qualisense
  (industrial quality inspection, with Johnson Electric). Cortica itself publishes no
  developer program, API, SDK or machine-readable specification on its own domain.'
